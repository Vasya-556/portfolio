name: Test Project

on:
    push:
        branches:
            - main

jobs:
    test:
        permissions: 
            contents: write
        runs-on: ubuntu-latest
        container: 
            image: node:22
        steps:
            - uses: actions/checkout@v3

            - name: Configure gh-pahes
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            
            - name: Backend
              working-directory: backend
              run: |
                npm ci
                npm test -- --run
                npm run build

            - name: Start backend
              working-directory: backend
              run: npm run dev > /tmp/backend.log 2>&1 &
              
            - name: Frontend
              working-directory: frontend
              run: |
                npm ci
                npm test -- --run
                git remote set-url origin https://git:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
                npm run deploy

        env:
            # backend
            FRONTEND_URL: ${{ vars.FRONTEND_URL }}
            IS_PRODUCTION: ${{ vars.IS_PRODUCTION }}
            PORT: ${{ vars.PORT }}
            PROTOCOL: ${{ vars.PROTOCOL }}
            GH_USERNAME: ${{ vars.GH_USERNAME }}
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
            # frontend
            VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
            VITE_IS_PRODUCTION: ${{ vars.VITE_IS_PRODUCTION }}
