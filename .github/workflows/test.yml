name: Test Project

on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        container: 
            image: node:22
        steps:
            - uses: actions/checkout@v3
              with: 
                node-version: 22
            - run: npm ci
              working-directory: backend
            - run: npm test
              working-directory: backend
            - run: npm run build
              working-directory: backend